<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mis Productos</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="store-content">
  <main class="store-page">

    <!-- Cabecera de la tienda: foto y nombre en la esquina -->
    <section class="shop-header">
      <img class="shop-logo" src="assets/img/mi-logo.png" alt="Foto de la tienda de frutas">
      <div class="shop-info">
        <h2>Frutas</h2>
        <p>Esta es una tienda de frutas</p>
      </div>
      <ion-button size="small" class="shop-contact">Contactar</ion-button>
    </section>

    <!-- FORMULARIO PARA AÑADIR PRODUCTOS -->
    <ion-list>
      <ion-item>
        <ion-input label="Nuevo producto" label-placement="floating" placeholder="¿Qué fruta quieres añadir?" [value]="nuevoProducto.titulo" (ionInput)="nuevoProducto.titulo = $any($event.detail.value)">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Precio (€)" label-placement="floating" type="number" placeholder="0" [value]="nuevoProducto.precio" (ionInput)="nuevoProducto.precio = +($event.detail.value ?? 0)">
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="agregarProducto()" class="ion-margin-top ion-margin-bottom">
      Añadir producto
    </ion-button>

    <!-- Productos -->
    <section class="products-section" aria-labelledby="products-title">
      <div class="section-heading">
        <h3 id="products-title">Productos</h3>
      </div>

      <ion-grid *ngIf="listaDeProductos.length > 0; else emptyList">
        <ion-row>
          @for (Producto of listaDeProductos; track Producto) {
            <ion-col size="6" size-md="4">
              <ion-card>
                <ion-card-header>
                  <ion-card-title>{{ Producto.titulo }}</ion-card-title>
                  <ion-card-subtitle>{{ Producto.precio }} €</ion-card-subtitle>
                </ion-card-header>
              </ion-card>
            </ion-col>
          }
        </ion-row>
      </ion-grid>

      <ng-template #emptyList>
        <p class="empty-state">No hay productos disponibles por ahora</p>
      </ng-template>

      <div class="actions">
        <ion-button color="danger">
          <ion-icon slot="start" name="trash"></ion-icon>
          Eliminar
        </ion-button>
        <ion-button color="secondary">
          <ion-icon slot="start" name="create"></ion-icon>
          Editar
        </ion-button>
      </div>
    </section>

  </main>
</ion-content>
