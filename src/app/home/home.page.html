<ion-header class="store-header">
  <ion-toolbar>
    <ion-title>Frutería</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="store-content">
  <main class="store-page">
    <section class="products-section" aria-labelledby="products-title">
      <div class="section-heading">
        <h2 id="products-title">Frutas</h2>
        
      </div>

      <div class="product-list" *ngIf="listaDeProductos.length > 0; else emptyList">
        <app-task-item
          *ngFor="let producto of listaDeProductos"
          [tarea]="producto">
        </app-task-item>
      </div>

      <ng-template #emptyList>
        <p class="empty-state">No hay productos disponibles por ahora</p>
      </ng-template>
    </section>
  </main>
</ion-content>
