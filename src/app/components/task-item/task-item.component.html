<ion-card>
  <ion-item lines="none">
    <ion-checkbox
      slot="start"
      [checked]="tarea.completada">
    </ion-checkbox>

    <ion-label [class.tachado]="tarea.completada">
      <h3>{{ tarea.titulo }}</h3>
      <p>{{ tarea.precio }} €</p>
    </ion-label>

    <ion-button (click)="mostrarDetalles()" slot="end" size="small">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
